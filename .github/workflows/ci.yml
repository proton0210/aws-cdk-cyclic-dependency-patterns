name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate pull-request metadata
        if: github.event_name == 'pull_request'
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_BRANCH" =~ ^(scenario|fix|docs|test|refactor|chore|ci)/[a-z0-9][a-z0-9._-]*$ ]] && \
             [[ ! "$PR_BRANCH" =~ ^dependabot/ ]]; then
            echo "Invalid branch name: $PR_BRANCH"
            echo "See CONTRIBUTING.md for allowed prefixes."
            exit 1
          fi

          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|test|refactor|chore|ci|build|perf|revert)(\([a-z0-9-]+\))?:\ .+[^.]$ ]]; then
            echo "Invalid pull-request title: $PR_TITLE"
            echo "Use Conventional Commit form; see CONTRIBUTING.md."
            exit 1
          fi
      - run: npm run check:repository
      - run: npm run build
      - run: npm test
      - run: npm run synth:all:valid
